[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hantu"
version = "0.1.0"
description = "Find the launch agents of apps you already deleted. Read-only by default; Gemma explains, code decides."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Edy Cu Tjong" }]
keywords = ["macos", "launchd", "launchagents", "cleanup", "gemma"]
classifiers = ["Operating System :: MacOS", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.urls]
Source = "https://github.com/edycutjong/hantu"

[project.scripts]
hantu = "hantu.cli:main"

[tool.setuptools]
packages = ["hantu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
